# Telly on the NAS: /volume2/docker/telly/ holds this file, data/ (SQLite) and .env (secrets,
# never in git). scripts/deploy.sh builds both images on the Mac and loads them onto the NAS.
#
# Ports: 18940 = API (LAN only; plexbot reaches /mcp here). 18941 = web, the only thing the
# Cloudflare tunnel routes to (telly.chrisx.art), and it proxies /api/* alone.
services:
  telly-api:
    image: telly-telly-api:latest
    container_name: telly-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "18940:8940"
    volumes:
      - ./data:/app/data
    mem_limit: 768m
    memswap_limit: 768m
    networks: [telly]

  telly-web:
    image: telly-telly-web:latest
    container_name: telly-web
    restart: unless-stopped
    ports:
      - "18941:3000"
    depends_on: [telly-api]
    mem_limit: 384m
    memswap_limit: 384m
    networks: [telly]

networks:
  telly:
    ipam:
      config:
        - subnet: 10.230.0.0/24  # pinned: the NAS's default pools are exhausted (see deploy-nas)
