[project]
name = "telly"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Christopher Robinson", email = "cxrobx@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mcp>=2.2.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
telly = "telly:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
